[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[project]
name = "benchmarking-app"
version = "0.1.0"
description = "FastAPI benchmark runner for MedQuAD, MedMCQA, and HealthBench across hosted LLM APIs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn[standard]>=0.35.0",
  "httpx>=0.28.1",
  "python-dotenv>=1.1.1",
  "sse-starlette>=2.3.6",
  "jinja2>=3.1.6",
  "rouge-score>=0.1.2",
  "bert-score>=0.3.13",
  "torch>=2.8.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.1",
  "pytest-asyncio>=1.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
